<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <!-- Pinch zooms the board, not the page. -->
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Easel</title>
    <link rel="icon" href="/easel_icon.svg">
    <style>
      :root {
        color-scheme: light dark;
        --text: #1f2328;
        --muted: #656d76;
        --panel: rgba(255, 255, 255, 0.94);
        --panel-border: rgba(31, 35, 40, 0.12);
        --hover: rgba(31, 35, 40, 0.07);
        --accent: #0969da;
        --danger: #d1242f;
        --shadow: 0 2px 12px rgba(0, 0, 0, 0.12), 0 0 0 1px var(--panel-border);
        --page: #f6f8fa;
        --paper: #fbfaf7;
        --paper-ink: #1f2328;
        --paper-line: rgba(31, 35, 40, 0.08);
        --dark: #1d2025;
        --dark-ink: #e6edf3;
        --dark-line: rgba(230, 237, 243, 0.08);
        --card: #fff;
        --unknown: rgba(110, 119, 129, 0.25);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --text: #e6edf3;
          --muted: #8d96a0;
          --panel: rgba(36, 39, 44, 0.94);
          --panel-border: rgba(230, 237, 243, 0.12);
          --hover: rgba(230, 237, 243, 0.08);
          --accent: #4493f8;
          --danger: #f85149;
          --shadow: 0 2px 12px rgba(0, 0, 0, 0.5), 0 0 0 1px var(--panel-border);
          --page: #16181c;
          /* Paper dims with the system; its ink follows. */
          --paper: #22252a;
          --paper-ink: #e6edf3;
          --paper-line: rgba(230, 237, 243, 0.07);
          --card: #2b2f35;
        }
      }

      html,
      body {
        background: var(--page);
        color: var(--text);
        height: 100%;
        margin: 0;
      }

      [hidden] {
        display: none !important;
      }

      button,
      select,
      input {
        color: inherit;
        font: inherit;
      }

      /* The editor. */

      .editor {
        inset: 0;
        overflow: hidden;
        position: fixed;
      }

      .viewport {
        --ink: var(--paper-ink);
        --line: var(--paper-line);
        background-color: var(--paper);
        background-position: var(--grid-x, 0) var(--grid-y, 0);
        background-size: var(--grid-size, 24px) var(--grid-size, 24px);
        cursor: default;
        inset: 0;
        outline: none;
        overflow: hidden;
        position: absolute;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }

      .viewport[data-palette='grid'],
      .viewport[data-palette='dark'] {
        background-image:
            linear-gradient(var(--line) 1px, transparent 1px),
            linear-gradient(90deg, var(--line) 1px, transparent 1px);
      }

      .viewport[data-palette='dots'] {
        background-image: radial-gradient(
            circle at 1px 1px, var(--muted) 1px, transparent 1.5px);
      }

      .viewport[data-palette='dark'] {
        --ink: var(--dark-ink);
        --line: var(--dark-line);
        --card: #2b2f35;
        background-color: var(--dark);
      }

      .viewport[data-tool='text'] {
        cursor: text;
      }

      .viewport[data-tool='rectangle'],
      .viewport[data-tool='circle'],
      .viewport[data-tool='arrow'],
      .viewport[data-tool='pen'] {
        cursor: crosshair;
      }

      .viewport.panning {
        cursor: grab;
      }

      .world {
        color: var(--ink);
        left: 0;
        position: absolute;
        top: 0;
        transform-origin: 0 0;
      }

      .obj {
        box-sizing: border-box;
        left: 0;
        position: absolute;
        top: 0;
      }

      .draft {
        height: 1px;
        left: 0;
        overflow: visible;
        pointer-events: none;
        position: absolute;
        top: 0;
        width: 1px;
      }

      .text-body {
        font-size: 16px;
        line-height: 1.35;
        min-height: 1.35em;
        outline: none;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      .text-body[data-style='title'] {
        font-size: 32px;
        font-weight: 700;
        line-height: 1.2;
      }

      .text-body[data-style='heading'] {
        font-size: 22px;
        font-weight: 600;
        line-height: 1.25;
      }

      .text-body[data-style='caption'] {
        font-size: 12px;
      }

      .text-body[data-font='serif'] {
        font-family: ui-serif, 'New York', Georgia, 'Times New Roman', serif;
      }

      .text-body[data-font='mono'] {
        font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      }

      .text-body[data-font='hand'] {
        font-family: Noteworthy, 'Bradley Hand', 'Segoe Print', 'Comic Sans MS',
            cursive;
        font-weight: 300;
      }

      .obj.editing {
        height: auto !important;
        user-select: text;
        -webkit-user-select: text;
      }

      .obj.editing .text-body {
        cursor: text;
      }

      .shape {
        display: block;
        overflow: visible;
      }

      .picture {
        display: block;
        height: 100%;
        object-fit: contain;
        pointer-events: none;
        width: 100%;
      }

      .card {
        background: var(--card);
        border-radius: 12px;
        box-shadow: var(--shadow);
        box-sizing: border-box;
        color: var(--text);
        cursor: pointer;
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
        width: 100%;
      }

      .viewport[data-palette='dark'] .card {
        color: var(--dark-ink);
      }

      .card-image {
        flex: 1 1 auto;
        min-height: 0;
        object-fit: cover;
        pointer-events: none;
        width: 100%;
      }

      .card-body {
        display: flex;
        flex: none;
        flex-direction: column;
        gap: 3px;
        padding: 10px 12px 11px;
      }

      .card-title,
      .card-description {
        -webkit-box-orient: vertical;
        display: -webkit-box;
        overflow: hidden;
      }

      .card-title {
        -webkit-line-clamp: 2;
        font-size: 14px;
        font-weight: 600;
        line-height: 1.3;
      }

      .card-description {
        -webkit-line-clamp: 2;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.35;
      }

      .card-host {
        color: var(--muted);
        font-size: 11px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .capture {
        border-radius: 8px;
        box-shadow: var(--shadow);
        cursor: pointer;
        height: 100%;
        overflow: hidden;
        position: relative;
        width: 100%;
      }

      .capture-image {
        display: block;
        height: 100%;
        object-fit: cover;
        pointer-events: none;
        width: 100%;
      }

      .capture-bar {
        align-items: center;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.6));
        bottom: 0;
        box-sizing: border-box;
        color: #fff;
        display: flex;
        font-size: 12px;
        gap: 6px;
        left: 0;
        opacity: 0;
        padding: 16px 8px 6px;
        pointer-events: none;
        position: absolute;
        right: 0;
        transition: opacity 120ms;
      }

      .capture:hover .capture-bar {
        opacity: 1;
      }

      .capture-icon {
        border-radius: 3px;
        flex: none;
        height: 14px;
        width: 14px;
      }

      .capture-title {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .unknown {
        align-items: center;
        background: var(--unknown);
        border-radius: 6px;
        box-sizing: border-box;
        color: var(--muted);
        display: flex;
        font-size: 12px;
        height: 100%;
        justify-content: center;
        padding: 8px;
        text-align: center;
        width: 100%;
      }

      /* The selection, in screen points. */

      .overlay {
        inset: 0;
        pointer-events: none;
        position: absolute;
      }

      .outline,
      .selection-box,
      .marquee,
      .handle {
        box-sizing: border-box;
        left: 0;
        position: absolute;
        top: 0;
      }

      .outline {
        border: 1px solid var(--accent);
        opacity: 0.6;
      }

      .selection-box {
        border: 1.5px solid var(--accent);
        margin: -1px;
      }

      .marquee {
        background: color-mix(in srgb, var(--accent) 10%, transparent);
        border: 1px solid var(--accent);
      }

      .handle {
        background: #fff;
        border: 1.5px solid var(--accent);
        border-radius: 2px;
        height: 10px;
        margin: -5px 0 0 -5px;
        pointer-events: auto;
        touch-action: none;
        width: 10px;
      }

      @media (pointer: coarse) {
        .handle {
          border-radius: 50%;
          height: 20px;
          margin: -10px 0 0 -10px;
          width: 20px;
        }
      }

      .handle[data-handle='nw'],
      .handle[data-handle='se'] {
        cursor: nwse-resize;
      }

      .handle[data-handle='ne'],
      .handle[data-handle='sw'] {
        cursor: nesw-resize;
      }

      .handle[data-handle='n'],
      .handle[data-handle='s'] {
        cursor: ns-resize;
      }

      .handle[data-handle='e'],
      .handle[data-handle='w'] {
        cursor: ew-resize;
      }

      /* The bars. */

      .topbar {
        align-items: center;
        display: flex;
        gap: 6px;
        left: 8px;
        pointer-events: none;
        position: absolute;
        right: 8px;
        top: 8px;
      }

      .topbar > * {
        pointer-events: auto;
      }

      .topbar .spacer {
        flex: 1;
        pointer-events: none;
      }

      .back,
      .title,
      .palette,
      .zoom,
      .topbar .icon-button {
        background: var(--panel);
        border: none;
        border-radius: 10px;
        box-shadow: var(--shadow);
        height: 34px;
      }

      .back {
        align-items: center;
        color: var(--muted);
        display: flex;
        padding: 0 12px;
        text-decoration: none;
      }

      .title {
        box-sizing: border-box;
        font-size: 15px;
        font-weight: 600;
        max-width: 50vw;
        min-width: 80px;
        padding: 0 12px;
        width: 320px;
      }

      .palette {
        padding: 0 8px;
      }

      .zoom {
        cursor: pointer;
        font-variant-numeric: tabular-nums;
        min-width: 56px;
        padding: 0 8px;
      }

      .toolbar {
        align-items: center;
        background: var(--panel);
        border-radius: 14px;
        bottom: max(12px, env(safe-area-inset-bottom));
        box-shadow: var(--shadow);
        box-sizing: border-box;
        display: flex;
        gap: 2px;
        left: 50%;
        max-width: calc(100% - 16px);
        overflow-x: auto;
        padding: 4px;
        position: absolute;
        scrollbar-width: none;
        transform: translateX(-50%);
      }

      .group {
        align-items: center;
        display: flex;
        flex: none;
        gap: 2px;
      }

      .group + .group {
        border-left: 1px solid var(--panel-border);
        margin-left: 4px;
        padding-left: 6px;
      }

      .group select {
        background: transparent;
        border: none;
        border-radius: 8px;
        height: 34px;
        padding: 0 4px;
      }

      .icon-button,
      .color-button {
        align-items: center;
        background: transparent;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        display: flex;
        flex: none;
        height: 34px;
        justify-content: center;
        padding: 0;
        width: 34px;
      }

      .icon-button:hover,
      .color-button:hover,
      .group select:hover {
        background: var(--hover);
      }

      .icon-button.active {
        background: color-mix(in srgb, var(--accent) 16%, transparent);
        color: var(--accent);
      }

      .icon-button:disabled {
        cursor: default;
        opacity: 0.35;
      }

      .icon {
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.5;
      }

      .colors .color-button {
        width: 26px;
      }

      .swatch {
        background: var(--text);
        border-radius: 50%;
        box-shadow: 0 0 0 1px var(--panel-border);
        height: 16px;
        width: 16px;
      }

      .color-button.active .swatch {
        box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--accent);
      }

      .menu {
        background: var(--panel);
        border-radius: 10px;
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        min-width: 180px;
        padding: 4px;
        position: fixed;
        z-index: 10;
      }

      .menu-item {
        background: transparent;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        padding: 7px 12px;
        text-align: start;
      }

      .menu-item:hover,
      .menu-item:focus-visible {
        background: var(--hover);
        outline: none;
      }

      .file-input {
        display: none;
      }

      .toast {
        background: var(--panel);
        border-radius: 10px;
        bottom: 72px;
        box-shadow: var(--shadow);
        left: 50%;
        max-width: calc(100% - 32px);
        opacity: 0;
        padding: 8px 14px;
        pointer-events: none;
        position: fixed;
        transform: translateX(-50%);
        transition: opacity 150ms;
        z-index: 20;
      }

      .toast.shown {
        opacity: 1;
      }

      .missing {
        align-items: center;
        display: flex;
        flex-direction: column;
        gap: 8px;
        justify-content: center;
        min-height: 100vh;
        padding: 0 24px;
        text-align: center;
      }

      a {
        color: var(--accent);
      }

      /* The list. */

      .list-page {
        margin: 0 auto;
        max-width: 720px;
        padding: 32px 16px 64px;
      }

      .list-header {
        align-items: center;
        display: flex;
        justify-content: space-between;
        margin-bottom: 16px;
      }

      .list-header h1 {
        font-size: 24px;
        margin: 0;
      }

      .primary {
        background: var(--accent);
        border: none;
        border-radius: 8px;
        color: #fff;
        cursor: pointer;
        padding: 8px 14px;
      }

      .primary.danger {
        background: var(--danger);
      }

      .text-button {
        background: transparent;
        border: none;
        border-radius: 6px;
        color: var(--muted);
        cursor: pointer;
        padding: 6px 10px;
      }

      .text-button:hover {
        background: var(--hover);
      }

      .text-button.danger:hover {
        color: var(--danger);
      }

      .easel-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .easel-row {
        align-items: center;
        background: var(--panel);
        border-radius: 12px;
        box-shadow: var(--shadow);
        display: flex;
        gap: 4px;
        padding: 6px 8px 6px 0;
      }

      .easel-row::before {
        background: var(--paper);
        border-radius: 6px;
        box-shadow: 0 0 0 1px var(--panel-border);
        content: '';
        flex: none;
        height: 28px;
        margin-left: 12px;
        width: 36px;
      }

      .easel-row[data-palette='dark']::before {
        background: var(--dark);
      }

      .easel-open {
        color: inherit;
        display: flex;
        flex: 1;
        flex-direction: column;
        min-width: 0;
        padding: 6px 8px;
        text-decoration: none;
      }

      .easel-title {
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .easel-meta {
        color: var(--muted);
        font-size: 12px;
      }

      .rename {
        flex: 1;
        margin: 6px 8px;
        padding: 4px 6px;
      }

      .empty {
        color: var(--muted);
        padding: 32px 8px;
        text-align: center;
      }

      dialog.confirm {
        background: var(--panel);
        border: none;
        border-radius: 14px;
        box-shadow: var(--shadow);
        color: var(--text);
        max-width: 360px;
        padding: 20px;
      }

      dialog.confirm p {
        margin: 0 0 8px;
      }

      dialog.confirm .detail {
        color: var(--muted);
        font-size: 13px;
      }

      dialog.confirm .buttons {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
