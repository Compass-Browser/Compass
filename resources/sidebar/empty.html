<!doctype html>
<html dir="$i18n{textdirection}" lang="$i18n{language}">
  <head>
    <meta charset="utf-8">
    <title>Compass</title>
    <link rel="stylesheet" href="chrome://resources/css/text_defaults_md.css">
    <link rel="stylesheet" href="chrome://theme/colors.css?sets=ui,chrome">
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        align-items: center;
        background: var(--color-sys-base, #fff);
        color: var(--color-sys-on-surface, #1f1f1f);
        cursor: default;
        display: flex;
        justify-content: center;
        user-select: none;
      }

      /* A space's tint over the frame color, with its grain. */
      :root[tinted] body {
        background: var(--tint), var(--color-frame-active, #dee3eb);
      }

      body::before {
        background-image: var(--grain-tile);
        background-size: var(--grain-size);
        content: '';
        image-rendering: pixelated;
        inset: 0;
        mix-blend-mode: overlay;
        opacity: var(--grain-opacity, 0);
        pointer-events: none;
        position: fixed;
      }

      /* Behind the command bar; seen once it's dismissed. */
      p {
        margin: 0;
        opacity: 0.5;
        position: relative;
      }
    </style>
  </head>
  <body>
    <p>Click anywhere to search or enter a URL</p>
    <script type="module" src="empty.js"></script>
  </body>
</html>
