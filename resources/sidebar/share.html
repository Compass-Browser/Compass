<!doctype html>
<html dir="$i18n{textdirection}" lang="$i18n{language}">
  <head>
    <meta charset="utf-8">
    <title>$i18n{shareTitle}</title>
    <link rel="stylesheet" href="chrome://resources/css/text_defaults_md.css">
    <link rel="stylesheet" href="chrome://theme/colors.css?sets=ui,chrome">
    <style>
      /* The downloads bubble's look (docs/design/downloads-bubble.md,
         "Look"): the window's space's tint, captioned cards of translucent
         white, pill buttons in the space's color. The colors come from the
         browser (SharePageHandler::GetLook()), so the page matches the
         bubble's frame. */
      :root {
        color-scheme: light dark;
        --background: #f4f4f6;
        --card: #fff;
        --pill: #fff;
        --track: rgba(0, 0, 0, 0.07);
        --hairline: rgba(0, 0, 0, 0.1);
        --text: #1d1d1f;
        --text-dim: #6e6e73;
        --accent: #007aff;
        --danger: #d70015;
        --card-radius: 12px;
        --control-radius: 7px;
      }

      :root[dark] {
        --danger: #ff6961;
      }

      html,
      body {
        background: var(--background);
        color: var(--text);
        font-size: 13px;
        margin: 0;
      }

      /* The bubble sizes to the page: a fixed width, a height up to a
         limit, past which the sheet scrolls under its header. */
      body {
        display: flex;
        flex-direction: column;
        max-height: 600px;
        width: 420px;
      }

      /* The join page fills a tab. */
      :root[tab] body {
        margin: 40px auto;
        max-height: none;
      }

      header {
        align-items: center;
        display: flex;
        flex: none;
        gap: 8px;
        padding: 14px 12px 6px 16px;
      }

      h1 {
        flex: 1;
        font-size: 15px;
        font-weight: 600;
        margin: 0;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #close {
        align-items: center;
        background: transparent;
        border: none;
        border-radius: 50%;
        color: var(--text-dim);
        display: flex;
        flex: none;
        height: 24px;
        justify-content: center;
        padding: 0;
        width: 24px;
      }

      #close:hover {
        background: var(--track);
      }

      #close svg {
        fill: none;
        height: 12px;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-width: 1.6;
        width: 12px;
      }

      :root[tab] #close {
        display: none;
      }

      main {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 0 12px 14px;
      }

      .sub {
        color: var(--text-dim);
        font-size: 12px;
        line-height: 1.4;
        margin: 0 4px 12px;
      }

      /* A group: its caption, then a card. */
      .caption {
        color: var(--text-dim);
        font-size: 12px;
        font-weight: 500;
        margin: 14px 4px 6px;
      }

      .card {
        background: var(--card);
        border-radius: var(--card-radius);
        overflow: hidden;
      }

      .card > .row {
        margin: 0;
        padding: 8px 12px;
      }

      /* Hairlines between a card's rows, from where the text starts. */
      .card > .row + .row {
        box-shadow: inset 12px 0 var(--card), inset 0 1px var(--hairline);
      }

      .row {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 6px 0;
      }

      .who {
        flex: 1;
        min-width: 0;
      }

      .who > div {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .email {
        color: var(--text-dim);
        font-size: 12px;
      }

      button,
      select,
      input {
        color: inherit;
        font: inherit;
      }

      /* Raised pill buttons; the main action in the space's color. */
      button {
        background: var(--pill);
        border: none;
        border-radius: var(--control-radius);
        box-shadow: 0 0 0 0.5px var(--hairline), 0 1px 2px rgba(0, 0, 0, 0.12);
        cursor: pointer;
        padding: 4px 12px;
      }

      :root[dark] button {
        box-shadow: inset 0 0.5px rgba(255, 255, 255, 0.12);
      }

      button:disabled {
        cursor: default;
        opacity: 0.5;
      }

      button.primary {
        background: var(--accent);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
        color: #fff;
      }

      button.danger {
        color: var(--danger);
      }

      button.danger.primary {
        background: var(--danger);
        color: #fff;
      }

      input[type=text],
      input[type=email],
      select {
        background: var(--pill);
        border: none;
        border-radius: var(--control-radius);
        box-shadow: 0 0 0 0.5px var(--hairline);
        padding: 4px 8px;
      }

      input:focus-visible,
      select:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      input[type=text],
      input[type=email] {
        flex: 1;
        min-width: 0;
      }

      .options select {
        flex: 1;
        min-width: 0;
      }

      .error {
        color: var(--danger);
        font-size: 12px;
        margin: 6px 4px 0;
      }

      .card .error {
        margin: 0;
      }

      .note {
        color: var(--text-dim);
        font-size: 12px;
        line-height: 1.4;
        margin: 6px 4px 0;
      }

      .card .note {
        margin: 0;
      }

      /* A question in place of a button (a bubble has no dialogs). */
      .confirm {
        background: var(--track);
        border-radius: var(--control-radius);
        flex-basis: 100%;
        padding: 8px 10px;
      }

      .confirm p {
        line-height: 1.4;
        margin: 0 0 8px;
      }

      .confirm .row {
        justify-content: flex-end;
        margin: 0;
      }

      .actions {
        justify-content: flex-end;
        margin-top: 14px;
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title"></h1>
      <button id="close" aria-label="$i18n{close}" title="$i18n{close}">
        <svg viewBox="0 0 12 12" aria-hidden="true">
          <path d="M2 2l8 8M10 2l-8 8"></path>
        </svg>
      </button>
    </header>
    <main id="app"></main>
    <script type="module" src="share/app.js"></script>
  </body>
</html>
