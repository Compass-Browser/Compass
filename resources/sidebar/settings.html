<!doctype html>
<html dir="$i18n{textdirection}" lang="$i18n{language}">
  <head>
    <meta charset="utf-8">
    <title>Compass Settings</title>
    <link rel="stylesheet" href="chrome://resources/css/text_defaults_md.css">
    <link rel="stylesheet" href="chrome://theme/colors.css?sets=ui,chrome">
    <style>
      body {
        background: var(--color-sys-base, #fff);
        color: var(--color-sys-on-surface, #1f1f1f);
        margin: 0;
      }

      /* A thin thumb on a transparent track, as the sidebar's. */
      html {
        /* Form controls follow the theme, as the page does. */
        color-scheme: light dark;
        scrollbar-color: color-mix(in srgb, currentColor 35%, transparent)
            transparent;
        scrollbar-width: thin;
      }

      main {
        margin: 0 auto;
        max-width: 640px;
        padding: 56px 24px;
      }

      h1 {
        font-size: 28px;
        font-weight: 500;
        margin: 0 0 32px;
      }

      .heading {
        align-items: baseline;
        display: flex;
        gap: 16px;
        justify-content: space-between;
        margin: 0 0 4px;
      }

      h2 {
        font-size: 18px;
        font-weight: 500;
        margin: 0;
      }

      .lead {
        margin: 0 0 24px;
        opacity: 0.75;
      }

      h3 {
        font-size: 13px;
        font-weight: 500;
        margin: 24px 0 8px;
        opacity: 0.7;
      }

      ul {
        border: 1px solid var(--color-sys-divider, #dadce0);
        border-radius: 12px;
        list-style: none;
        margin: 0;
        padding: 0;
      }

      li {
        padding: 8px 12px 8px 16px;
      }

      li + li {
        border-top: 1px solid var(--color-sys-divider, #dadce0);
      }

      .row {
        align-items: center;
        display: flex;
        gap: 12px;
        min-height: 32px;
      }

      .label {
        flex: 1;
      }

      .default {
        font-size: 12px;
        opacity: 0.6;
      }

      .keys {
        background: color-mix(in srgb, currentColor 10%, transparent);
        border: 1px solid transparent;
        border-radius: 8px;
        color: inherit;
        cursor: pointer;
        font: inherit;
        font-variant-numeric: tabular-nums;
        min-width: 88px;
        padding: 4px 10px;
        text-align: center;
      }

      .keys:hover {
        border-color: var(--color-sys-outline, #747775);
      }

      .keys.none {
        opacity: 0.6;
      }

      .keys.recording {
        border-color: var(--color-sys-primary, #0b57d0);
        color: var(--color-sys-primary, #0b57d0);
      }

      button.link {
        background: none;
        border: none;
        color: var(--color-sys-primary, #0b57d0);
        cursor: pointer;
        font: inherit;
        padding: 4px;
      }

      button.link:disabled {
        cursor: default;
        opacity: 0.4;
      }

      /* Reset and Remove keep their place when they don't apply. */
      button.link.hidden {
        visibility: hidden;
      }

      .message {
        font-size: 12px;
        margin: 6px 0 2px;
      }

      .message.error {
        color: var(--color-sys-error, #b3261e);
      }

      .message button.link {
        font-size: 12px;
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Settings</h1>
      <section id="shortcuts">
        <div class="heading">
          <h2>Keyboard shortcuts</h2>
          <button id="resetAll" class="link">Reset all</button>
        </div>
        <p class="lead">
          Click a shortcut, then press the keys you want. Esc cancels, Delete
          leaves it without a shortcut.
        </p>
        <div id="sections"></div>
      </section>
    </main>
    <script type="module" src="settings.js"></script>
  </body>
</html>
