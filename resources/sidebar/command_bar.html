<!doctype html>
<html dir="$i18n{textdirection}" lang="$i18n{language}">
  <head>
    <meta charset="utf-8">
    <title>$i18n{commandBarTitle}</title>
    <link rel="stylesheet" href="chrome://theme/colors.css?sets=ui,chrome">
    <link rel="stylesheet" href="chrome://resources/css/text_defaults_md.css">
    <style>
      /* The bubble sizes itself to the page, so the width is fixed here. */
      html,
      body {
        width: 760px;
      }

      body {
        background-color: var(--color-tab-search-background);
        margin: 0;
      }

      /* Over the bubble's backdrop (what's behind the window, blurred), as
       * a translucent sidebar over the window's: tinted, not covered. */
      html[translucent] body {
        background-color: color-mix(in srgb,
            var(--color-tab-search-background) 45%, transparent);
      }
    </style>
  </head>
  <body>
    <compass-command-bar-app></compass-command-bar-app>
    <script type="module" src="command_bar/app.js"></script>
  </body>
</html>
