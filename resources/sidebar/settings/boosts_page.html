<style>
  .compass-page .boosts-lead {
    margin: 0 0 12px;
    opacity: 0.75;
  }

  .compass-page .boosts-list {
    display: flex;
    flex-direction: column;
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .compass-page .boosts-site {
    font-size: 12px;
    font-weight: 500;
    margin: 14px 0 2px;
    opacity: 0.6;
  }

  .compass-page .boosts-site:first-child {
    margin-top: 0;
  }

  .compass-page .boosts-row {
    align-items: center;
    border-top: 1px solid var(--color-sys-divider,
        var(--cr-separator-color, rgba(0, 0, 0, 0.12)));
    display: flex;
    gap: 10px;
    min-height: 44px;
  }

  .compass-page .boosts-name {
    flex: 1;
    font-weight: 500;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .compass-page .boosts-row[disabled] .boosts-name {
    opacity: 0.5;
  }

  .compass-page .boosts-badge {
    border: 1px solid var(--color-sys-outline,
        var(--cr-fallback-color-outline, #747775));
    border-radius: 10px;
    font-size: 11px;
    padding: 1px 8px;
    white-space: nowrap;
  }

  .compass-page .boosts-kinds {
    font-size: 12px;
    opacity: 0.6;
    white-space: nowrap;
  }

  .compass-page .boosts-empty {
    margin: 4px 0;
    opacity: 0.6;
  }

  .compass-page .boosts-form {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin: 14px 0 0;
  }

  .compass-page .boosts-form label {
    display: flex;
    flex-direction: column;
    font-size: 12px;
    gap: 4px;
  }

  .compass-page .boosts-form input[type=text],
  .compass-page .boosts-form select,
  .compass-page .boosts-form textarea {
    background: var(--color-sys-base,
        var(--cr-fallback-color-surface, #fff));
    border: 1px solid var(--color-sys-outline,
        var(--cr-fallback-color-outline, #747775));
    border-radius: 8px;
    box-sizing: border-box;
    color: inherit;
    font: inherit;
    font-size: 13px;
    padding: 8px 10px;
  }

  .compass-page .boosts-form textarea {
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    font-size: 12px;
    min-height: 120px;
    resize: vertical;
    tab-size: 2;
  }

  .compass-page .boosts-form .boosts-hint {
    opacity: 0.6;
  }

  .compass-page .boosts-buttons {
    display: flex;
    gap: 8px;
    margin: 14px 0 0;
  }

  .compass-page .boosts-page button {
    background: var(--color-sys-primary,
        var(--cr-fallback-color-primary, #0b57d0));
    border: none;
    border-radius: 18px;
    color: var(--color-sys-on-primary,
        var(--cr-fallback-color-on-primary, #fff));
    cursor: pointer;
    font: inherit;
    font-weight: 500;
    padding: 8px 20px;
  }

  .compass-page .boosts-page button.secondary {
    background: none;
    border: 1px solid var(--color-sys-outline,
        var(--cr-fallback-color-outline, #747775));
    color: inherit;
  }

  .compass-page .boosts-page .boosts-row button {
    padding: 4px 14px;
  }

  .compass-page .boosts-share {
    align-items: center;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 0 0 10px 34px;
  }

  .compass-page .boosts-page .boosts-share button {
    padding: 4px 14px;
  }

  .compass-page .boosts-share-note {
    font-size: 12px;
    opacity: 0.7;
  }

  .compass-page .boosts-import {
    border-top: 1px solid var(--color-sys-divider,
        var(--cr-separator-color, rgba(0, 0, 0, 0.12)));
    margin: 14px 0 0;
    padding: 14px 0 0;
  }

  .compass-page .boosts-import h3 {
    font-size: 14px;
    font-weight: 500;
    margin: 0 0 10px;
  }

  .compass-page .boosts-import dl {
    display: grid;
    gap: 4px 12px;
    grid-template-columns: max-content 1fr;
    margin: 0 0 10px;
  }

  .compass-page .boosts-import dt {
    opacity: 0.6;
  }

  .compass-page .boosts-import dd {
    font-weight: 500;
    margin: 0;
    overflow-wrap: anywhere;
  }

  .compass-page .boosts-code-label {
    display: block;
    font-size: 12px;
    margin: 10px 0 4px;
  }

  .compass-page .boosts-code {
    border: 1px solid var(--color-sys-outline,
        var(--cr-fallback-color-outline, #747775));
    border-radius: 8px;
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    font-size: 12px;
    margin: 0 0 4px;
    max-height: 320px;
    overflow: auto;
    padding: 8px 10px;
    tab-size: 2;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .compass-page .boosts-import .boosts-hint {
    font-size: 12px;
    opacity: 0.6;
  }

  .compass-page .boosts-warning {
    background: var(--color-sys-error-container,
        var(--cr-fallback-color-error-container, #f9dedc));
    border-radius: 8px;
    color: var(--color-sys-on-error-container, #410e0b);
    font-size: 13px;
    margin: 0 0 6px;
    padding: 8px 12px;
  }

  .compass-page .boosts-note {
    color: var(--color-sys-error, var(--cr-fallback-color-error, #b3261e));
    font-size: 12px;
    margin: 0;
  }
</style>
<div class="boosts-page">
  <p class="boosts-lead">$i18n{boostsPageLead}</p>
  <ul id="boosts" class="boosts-list"></ul>
  <p id="noBoosts" class="boosts-empty" hidden>$i18n{boostsPageNoBoosts}</p>
  <form id="boostForm" class="boosts-form" hidden>
    <label>$i18n{boostsPageName}
      <input id="boostName" type="text" placeholder="$i18n{boostsPageNamePlaceholder}"
          autocomplete="off" maxlength="100">
    </label>
    <label>$i18n{boostsPageSite}
      <input id="boostMatch" type="text" placeholder="github.com"
          autocomplete="off" spellcheck="false">
      <span class="boosts-hint">$i18n{boostsPageSiteHint}</span>
    </label>
    <label>CSS
      <textarea id="boostCss" spellcheck="false"
          placeholder="header { display: none !important; }"></textarea>
      <span class="boosts-hint">$i18n{boostsPageCssHint}</span>
    </label>
    <label>JavaScript
      <textarea id="boostJs" spellcheck="false"></textarea>
      <span class="boosts-hint">$i18n{boostsPageJsHint}</span>
    </label>
    <label>$i18n{boostsPageJsRuns}
      <select id="boostWorld">
        <option value="isolated">$i18n{boostsPageWorldIsolated}</option>
        <option value="main">$i18n{boostsPageWorldMain}</option>
      </select>
    </label>
    <p id="boostNote" class="boosts-note" hidden></p>
    <div class="boosts-buttons">
      <button id="saveBoost" type="submit">$i18n{save}</button>
      <button id="cancelBoost" class="secondary" type="button">
        $i18n{cancel}
      </button>
    </div>
  </form>
  <section id="boostImport" class="boosts-import" hidden
      aria-labelledby="importHeading">
    <h3 id="importHeading">$i18n{boostsPageAddShared}</h3>
    <div id="importDetails">
      <dl>
        <dt>$i18n{boostsPageName}</dt>
        <dd id="importName"></dd>
        <dt>$i18n{boostsPageSite}</dt>
        <dd id="importMatch"></dd>
      </dl>
      <p id="importWarning" class="boosts-warning" hidden></p>
      <div id="importCssBlock">
        <span class="boosts-code-label">CSS</span>
        <pre id="importCss" class="boosts-code"></pre>
      </div>
      <div id="importJsBlock">
        <span class="boosts-code-label">JavaScript</span>
        <pre id="importJs" class="boosts-code"></pre>
        <span id="importWorld" class="boosts-hint"></span>
      </div>
    </div>
    <p id="importNote" class="boosts-note" hidden></p>
    <div class="boosts-buttons">
      <button id="confirmImport">$i18n{boostsPageAddBoost}</button>
      <button id="cancelImport" class="secondary">$i18n{cancel}</button>
    </div>
  </section>
  <div class="boosts-buttons">
    <button id="addBoost" class="secondary">$i18n{boostsPageAddBoost}</button>
    <button id="importBoost" class="secondary">$i18n{boostsPageImport}</button>
  </div>
</div>
