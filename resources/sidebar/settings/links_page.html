<style>
  .compass-page .links-lead {
    margin: 0 0 12px;
    opacity: 0.75;
  }

  .compass-page .links-list {
    display: flex;
    flex-direction: column;
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .compass-page .links-row {
    align-items: center;
    border-top: 1px solid var(--color-sys-divider,
        var(--cr-separator-color, rgba(0, 0, 0, 0.12)));
    display: flex;
    gap: 10px;
    min-height: 44px;
  }

  .compass-page .links-row:first-child {
    border-top: none;
  }

  .compass-page .links-domain {
    flex: 1;
    font-weight: 500;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .compass-page .links-space {
    align-items: center;
    display: flex;
    gap: 8px;
    min-width: 0;
  }

  .compass-page .links-broken {
    color: var(--color-sys-error, var(--cr-fallback-color-error, #b3261e));
  }

  .compass-page .links-space-icon {
    align-items: center;
    border-radius: 6px;
    color: #fff;
    display: inline-flex;
    flex: none;
    font-size: 12px;
    font-weight: 600;
    height: 22px;
    justify-content: center;
    width: 22px;
  }

  .compass-page .links-space-icon svg {
    fill: currentColor;
    height: 16px;
    width: 16px;
  }

  .compass-page .links-space-icon.emoji {
    font-size: 15px;
  }

  .compass-page .links-empty {
    margin: 4px 0;
    opacity: 0.6;
  }

  .compass-page .links-form {
    align-items: center;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 14px 0 0;
  }

  .compass-page .links-form input,
  .compass-page .links-form select {
    background: var(--color-sys-base,
        var(--cr-fallback-color-surface, #fff));
    border: 1px solid var(--color-sys-outline,
        var(--cr-fallback-color-outline, #747775));
    border-radius: 8px;
    box-sizing: border-box;
    color: inherit;
    font: inherit;
    padding: 8px 10px;
  }

  .compass-page .links-form input {
    flex: 1;
    min-width: 200px;
  }

  .compass-page .links-buttons {
    display: flex;
    gap: 8px;
    margin: 14px 0 0;
  }

  .compass-page .links-page button {
    background: var(--color-sys-primary,
        var(--cr-fallback-color-primary, #0b57d0));
    border: none;
    border-radius: 18px;
    color: var(--color-sys-on-primary,
        var(--cr-fallback-color-on-primary, #fff));
    cursor: pointer;
    font: inherit;
    font-weight: 500;
    padding: 8px 20px;
  }

  .compass-page .links-page button.secondary {
    background: none;
    border: 1px solid var(--color-sys-outline,
        var(--cr-fallback-color-outline, #747775));
    color: inherit;
  }

  .compass-page .links-page .links-row button {
    padding: 4px 14px;
  }

  .compass-page .links-note {
    color: var(--color-sys-error, var(--cr-fallback-color-error, #b3261e));
    flex-basis: 100%;
    font-size: 12px;
    margin: 0;
  }
</style>
<div class="links-page">
  <p class="links-lead">$i18n{linksPageLead}</p>
  <ul id="linkRules" class="links-list"></ul>
  <p id="noLinkRules" class="links-empty" hidden>$i18n{linksPageNoSites}</p>
  <form id="linkRuleForm" class="links-form" hidden>
    <input id="linkDomain" type="text" placeholder="github.com"
        aria-label="$i18n{linksPageSiteLabel}" autocomplete="off" spellcheck="false">
    <select id="linkSpace" aria-label="$i18n{linksPageSpaceLabel}"></select>
    <button id="saveLinkRule" type="submit">$i18n{save}</button>
    <button id="cancelLinkRule" class="secondary" type="button">
      $i18n{cancel}
    </button>
    <p id="linkNote" class="links-note" hidden></p>
  </form>
  <div class="links-buttons">
    <button id="addLinkRule" class="secondary">$i18n{linksPageAddSite}</button>
  </div>
</div>
