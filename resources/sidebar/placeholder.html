<!doctype html>
<html dir="$i18n{textdirection}" lang="$i18n{language}">
  <head>
    <meta charset="utf-8">
    <title>Open in another window</title>
    <link rel="stylesheet" href="chrome://resources/css/text_defaults_md.css">
    <link rel="stylesheet" href="chrome://theme/colors.css?sets=ui,chrome">
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        align-items: center;
        background: var(--color-sys-base, #fff);
        color: var(--color-sys-on-surface, #1f1f1f);
        display: flex;
        justify-content: center;
      }

      /* The tab as it was when it left, frozen and slightly dimmed. */
      #snapshot {
        filter: brightness(0.85) saturate(0.8);
        height: 100%;
        inset: 0;
        object-fit: cover;
        object-position: top left;
        position: absolute;
        width: 100%;
      }

      #snapshot:not([src]) {
        display: none;
      }

      main {
        max-width: 420px;
        padding: 24px;
        position: relative;
        text-align: center;
      }

      #title {
        font-size: 18px;
        font-weight: 500;
        margin: 0 0 8px;
        overflow-wrap: anywhere;
      }

      p {
        margin: 0 0 20px;
        opacity: 0.7;
      }

      button {
        background: var(--color-sys-primary, #0b57d0);
        border: none;
        border-radius: 18px;
        color: var(--color-sys-on-primary, #fff);
        cursor: pointer;
        font: inherit;
        font-weight: 500;
        padding: 8px 20px;
      }

      /* With a screenshot, the text shrinks to a pill at the bottom. */
      body.has-snapshot {
        align-items: flex-end;
      }

      body.has-snapshot main {
        align-items: center;
        background: var(--color-sys-base-container-elevated, #fff);
        border-radius: 24px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        display: flex;
        gap: 12px;
        margin-bottom: 24px;
        max-width: none;
        padding: 6px 6px 6px 18px;
      }

      body.has-snapshot #title {
        display: none;
      }

      body.has-snapshot p {
        margin: 0;
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <img id="snapshot" alt="">
    <main>
      <h1 id="title"></h1>
      <p>Open in another window</p>
      <button id="bringHere">Bring here</button>
    </main>
    <script type="module" src="placeholder.js"></script>
  </body>
</html>
