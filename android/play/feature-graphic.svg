<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <!-- Play's 1024x500 feature graphic: website/compass.svg's icon on the
       glyph's blue, with the name. Render with docs/building.md ("Android releases (Google Play)"). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A5BEA"/>
      <stop offset="0.6" stop-color="#2238C9"/>
      <stop offset="1" stop-color="#170C83"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#FF5D70" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FF5D70" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#ECEEF3"/>
    </linearGradient>
    <linearGradient id="red" gradientUnits="userSpaceOnUse" x1="690" y1="340" x2="330" y2="620">
      <stop offset="0" stop-color="#FF8F98"/>
      <stop offset="0.45" stop-color="#FF5D70"/>
      <stop offset="1" stop-color="#F23D57"/>
    </linearGradient>
    <linearGradient id="blue" gradientUnits="userSpaceOnUse" x1="330" y1="430" x2="700" y2="660">
      <stop offset="0" stop-color="#3A5BEA"/>
      <stop offset="0.55" stop-color="#2238C9"/>
      <stop offset="1" stop-color="#170C83"/>
    </linearGradient>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#0B0640" flood-opacity="0.45"/>
    </filter>
    <filter id="glyph" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1B1F4A" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1024" height="500" fill="url(#sky)"/>
  <rect width="1024" height="500" fill="url(#glow)"/>
  <!-- The icon, 300 px, its card 100..924 of 1024 scaled by 300/824. -->
  <g transform="translate(110 100) scale(0.36408) translate(-100 -100)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#card)"/>
    <g filter="url(#glyph)" fill="none" stroke-linecap="round" stroke-width="140">
      <path d="M337.4 441.9 A205 205 0 0 0 682.3 649.2" stroke="url(#blue)"/>
      <path d="M682.3 374.8 A205 205 0 0 0 344.2 598.6" stroke="url(#red)" opacity="0.9"/>
    </g>
  </g>
  <g fill="#FFFFFF" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', 'DejaVu Sans', sans-serif">
    <text x="470" y="245" font-size="92" font-weight="700" letter-spacing="-2">Compass</text>
    <text x="474" y="305" font-size="31" font-weight="400" fill-opacity="0.85">Spaces, sync and Claude,</text>
    <text x="474" y="345" font-size="31" font-weight="400" fill-opacity="0.85">in a browser for Android</text>
  </g>
</svg>
