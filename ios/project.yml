# XcodeGen spec for Compass for iOS. Regenerate the project after editing:
#   tools/compass ios gen      (= cd ios && xcodegen)
# Compass.xcodeproj is committed so Xcode opens it without XcodeGen.
name: Compass
options:
  bundleIdPrefix: it.cipi1965.compass
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 4M33B5HNDS
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  CompassKit:
    path: CompassKit
targets:
  Compass:
    type: application
    platform: iOS
    scheme:
      testTargets: [CompassUITests]
    sources:
      - path: App
      # Also in the Widgets extension: App Intents entities and intents, the
      # download activity's attributes.
      - path: Shared
      # The desktop's Icon Composer icon, shared.
      - path: ../assets/Compass.icon
        buildPhase: resources
    entitlements:
      path: App/Compass.entitlements
      properties:
        # Shared with the AutoFill extension (passwords). Needs no
        # capability on the developer site; the team prefix is enough.
        keychain-access-groups:
          - $(AppIdentifierPrefix)it.cipi1965.compass.shared
        # App Store Connect wants it on the app as well as the extension.
        com.apple.developer.authentication-services.autofill-credential-provider: true
        # Shared with the extensions (docs/design/ios.md, "System extensions").
        # The App IDs need the App Groups capability with this group.
        com.apple.security.application-groups:
          - group.it.cipi1965.compass
        # APNs for tabs sent from the desktop (docs/design/send-tab.md);
        # exported as production for TestFlight and the App Store.
        aps-environment: development
    dependencies:
      - target: AutoFill
        embed: true
      - target: PushService
        embed: true
      - target: Share
        embed: true
      - target: Widgets
        embed: true
      - target: SafariOpen
        embed: true
      - package: CompassKit
        product: CompassShared
      - package: CompassKit
        product: CompassCrypto
      - package: CompassKit
        product: CompassSync
      - package: CompassKit
        product: CompassModel
    info:
      path: App/Info.plist
      properties:
        # "Compass" is taken on the App Store (ITMS-90129).
        CFBundleName: Compass Browser
        CFBundleDisplayName: Compass Browser
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Compass scans the pairing code shown on your Mac.
        NSFaceIDUsageDescription: Compass asks for Face ID before showing your recovery code.
        # audio: a picture-in-picture video keeps playing outside the app.
        UIBackgroundModes: [fetch, audio]
        # Self-hosted servers on the LAN or Tailscale may be plain HTTP.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: it.cipi1965.compass.pair
            CFBundleURLSchemes: [compass-pair]
          # Widgets, the icon menu, Spotlight and the extensions (DeepLink).
          - CFBundleURLName: it.cipi1965.compass.link
            CFBundleURLSchemes: [compass]
          # Web links, for when Compass is the default browser (that needs
          # the com.apple.developer.web-browser entitlement; until Apple
          # grants it, iOS doesn't send these here).
          - CFBundleURLName: it.cipi1965.compass.web
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [http, https]
        BGTaskSchedulerPermittedIdentifiers: [it.cipi1965.compass.refresh]
        # Downloads on the Lock Screen and in the Dynamic Island.
        NSSupportsLiveActivities: true
        # Spotlight results open entries (CSSearchableItemActionType).
        NSUserActivityTypes: [com.apple.corespotlightitem]
        # Downloads show in the Files app (Documents/Downloads).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CompassKeychainGroup: $(AppIdentifierPrefix)it.cipi1965.compass.shared
        # Export compliance: standard algorithms (AES, HMAC, Ed25519,
        # SPAKE2, scrypt) protecting the user's own data, which is exempt.
        # Saves answering the question for every TestFlight build.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.cipi1965.compass
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: Compass
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
  AutoFill:
    type: app-extension
    platform: iOS
    sources:
      - path: AutoFill
    entitlements:
      path: AutoFill/AutoFill.entitlements
      properties:
        # The App ID it.cipi1965.compass.autofill needs the AutoFill Credential
        # Provider capability on the developer site.
        com.apple.developer.authentication-services.autofill-credential-provider: true
        keychain-access-groups:
          - $(AppIdentifierPrefix)it.cipi1965.compass.shared
    dependencies:
      - package: CompassKit
        product: CompassSync
      - sdk: AuthenticationServices.framework
    info:
      path: AutoFill/Info.plist
      properties:
        # "Compass" is taken on the App Store (ITMS-90129).
        CFBundleName: Compass Browser
        CFBundleDisplayName: Compass Browser
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CompassKeychainGroup: $(AppIdentifierPrefix)it.cipi1965.compass.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CredentialProviderViewController
          NSExtensionAttributes:
            ASCredentialProviderExtensionCapabilities:
              ProvidesPasswords: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.cipi1965.compass.autofill
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
  # Rewrites the server's "New tab" push into the sent tab's title and host
  # (docs/design/send-tab.md).
  PushService:
    type: app-extension
    platform: iOS
    sources:
      - path: PushService
    entitlements:
      path: PushService/PushService.entitlements
      properties:
        # The seed and server, as the app keeps them (Keychain.swift).
        keychain-access-groups:
          - $(AppIdentifierPrefix)it.cipi1965.compass.shared
        # PushAccounts.json. The App ID needs the App Groups capability.
        com.apple.security.application-groups:
          - group.it.cipi1965.compass
    dependencies:
      - package: CompassKit
        product: CompassSync
      - package: CompassKit
        product: CompassShared
    info:
      path: PushService/Info.plist
      properties:
        CFBundleName: Compass Browser
        CFBundleDisplayName: Compass Browser
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CompassKeychainGroup: $(AppIdentifierPrefix)it.cipi1965.compass.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.cipi1965.compass.push
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
  # The share sheet's "Compass Browser": open a link, or pin it to a space.
  Share:
    type: app-extension
    platform: iOS
    sources:
      - path: Share
    entitlements:
      path: Share/Share.entitlements
      properties:
        com.apple.security.application-groups:
          - group.it.cipi1965.compass
    dependencies:
      - package: CompassKit
        product: CompassShared
    info:
      path: Share/Info.plist
      properties:
        CFBundleName: Compass Browser
        CFBundleDisplayName: Compass Browser
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.cipi1965.compass.share
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
  # Home and Lock Screen widgets, the Control Center control and the
  # download Live Activity.
  Widgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    entitlements:
      path: Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.it.cipi1965.compass
    dependencies:
      - package: CompassKit
        product: CompassShared
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleName: Compass Browser
        CFBundleDisplayName: Compass Browser
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.cipi1965.compass.widgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
  # Safari's "Open in Compass" toolbar button.
  SafariOpen:
    type: app-extension
    platform: iOS
    sources:
      - path: SafariOpen/SafariWebExtensionHandler.swift
      # At the bundle's root, as Safari wants them; images/ and _locales/
      # keep their folders.
      - path: SafariOpen/Resources
        buildPhase: resources
        excludes: ["images/**", "_locales/**"]
      - path: SafariOpen/Resources/images
        type: folder
        buildPhase: resources
      - path: SafariOpen/Resources/_locales
        type: folder
        buildPhase: resources
    entitlements:
      path: SafariOpen/SafariOpen.entitlements
      properties:
        com.apple.security.application-groups:
          - group.it.cipi1965.compass
    dependencies:
      - package: CompassKit
        product: CompassShared
    info:
      path: SafariOpen/Info.plist
      properties:
        CFBundleName: Open in Compass
        CFBundleDisplayName: Open in Compass
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.cipi1965.compass.safari
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
  # Real touches (gestures), checked from screenshots taken meanwhile.
  CompassUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Compass
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.cipi1965.compass.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
