# XcodeGen spec for Compass for iOS. Regenerate the project after editing:
#   tools/compass ios gen      (= cd ios && xcodegen)
# Compass.xcodeproj is committed so Xcode opens it without XcodeGen.
name: Compass
options:
  bundleIdPrefix: it.cipi1965.compass
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # English, and Italian from the String Catalogs (Localizable.xcstrings,
  # InfoPlist.xcstrings); XcodeGen takes knownRegions from them.
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 4M33B5HNDS
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  CompassKit:
    path: CompassKit
targets:
  Compass:
    type: application
    platform: iOS
    scheme:
      testTargets: [CompassUITests]
    sources:
      - path: App
      # Also in the Widgets extension: App Intents entities and intents, the
      # download activity's attributes.
      - path: Shared
      # The desktop's Icon Composer icon, shared.
      - path: ../assets/Compass.icon
        buildPhase: resources
      # Claude's prompt, tools and page script, shared with the desktop
      # (docs/design/claude.md).
      - path: ../common/claude/system_prompt.md
        buildPhase: resources
      - path: ../common/claude/tools.json
        buildPhase: resources
      - path: ../common/claude/page_agent.js
        buildPhase: resources
      - path: ../common/claude/sidebar_prompts.md
        buildPhase: resources
      # Firefox's strip-on-share lists and their licenses, unmodified, shared
      # with the desktop: Copy Link leaves out tracking parameters, and
      # Settings shows the licenses (docs/design/ios.md, "Clean copied
      # links"). A folder, so the two LICENSE files keep their own paths
      # (strip_on_share/MPL2/LICENSE, strip_on_share/LGPL/LICENSE).
      - path: ../third_party/strip_on_share
        type: folder
        buildPhase: resources
      # Picture-in-picture for calls, shared with the desktop
      # (docs/design/picture-in-picture.md, "Calls").
      - path: ../common/picture_in_picture/call_pip.js
        buildPhase: resources
      # Reader mode, shared with the desktop (docs/design/reader-mode.md):
      # Readability and reader.js run in pages; the rest is the reader page.
      - path: ../common/reader/Readability.js
        buildPhase: resources
      - path: ../common/reader/Readability-readerable.js
        buildPhase: resources
      - path: ../common/reader/reader.js
        buildPhase: resources
      - path: ../common/reader/reader.html
        buildPhase: resources
      - path: ../common/reader/reader.css
        buildPhase: resources
      - path: ../common/reader/reader_view.js
        buildPhase: resources
      # Live folder plugins: the SDK, the runtime scripts and the built-ins,
      # shared with the desktop (docs/design/live-folders.md). Folders at
      # the bundle's top, laid out as plugins/ is: a "plugins" folder would
      # be the bundle's PlugIns (the extensions) on a case-insensitive disk.
      - path: ../plugins/sdk
        type: folder
        buildPhase: resources
      - path: ../plugins/runtime
        type: folder
        buildPhase: resources
      - path: ../plugins/builtin
        type: folder
        buildPhase: resources
      # The sync server Compass sets up in the user's Cloudflare account,
      # and its version, shared with the desktop (docs/design/sync.md, "A
      # free server on Cloudflare"; docs/design/ios.md, "A server on
      # Cloudflare").
      - path: ../server/cloudflare/dist/compass-sync.js
        buildPhase: resources
      - path: ../server/cloudflare/dist/compass-sync.version
        buildPhase: resources
    entitlements:
      path: App/Compass.entitlements
      properties:
        # Shared with the AutoFill extension (passwords). Needs no
        # capability on the developer site; the team prefix is enough.
        keychain-access-groups:
          - $(AppIdentifierPrefix)it.cipi1965.compass.shared
        # App Store Connect wants it on the app as well as the extension.
        com.apple.developer.authentication-services.autofill-credential-provider: true
        # Shared with the extensions (docs/design/ios.md, "System extensions").
        # The App IDs need the App Groups capability with this group.
        com.apple.security.application-groups:
          - group.it.cipi1965.compass
        # APNs for tabs sent from the desktop (docs/design/send-tab.md);
        # exported as production for TestFlight and the App Store.
        aps-environment: development
        # Compass can be the default browser (granted by Apple 2026-11-21):
        # iOS offers it under Settings → Apps → Default Browser App and
        # sends it web links from other apps.
        com.apple.developer.web-browser: true
    dependencies:
      - target: AutoFill
        embed: true
      - target: PushService
        embed: true
      - target: Share
        embed: true
      - target: Widgets
        embed: true
      - target: SafariOpen
        embed: true
      - package: CompassKit
        product: CompassShared
      - package: CompassKit
        product: CompassCrypto
      - package: CompassKit
        product: CompassSync
      - package: CompassKit
        product: CompassModel
      - package: CompassKit
        product: CompassClaude
      - package: CompassKit
        product: CompassOnDevice
      - package: CompassKit
        product: CompassLiveFolders
      - package: CompassKit
        product: CompassBoosts
      - package: CompassKit
        product: CompassEasels
      - package: CompassKit
        product: CompassRooms
    info:
      path: App/Info.plist
      properties:
        # "Compass" is taken on the App Store (ITMS-90129), for the display
        # name too.
        CFBundleName: Compass Browser
        CFBundleDisplayName: Compass Browser
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPad: several windows (docs/design/ios.md, "Multiple windows").
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # iPad: every orientation, as Split View and Stage Manager need.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Compass scans the pairing code shown on your Mac, and lets websites you allow use the camera.
        NSMicrophoneUsageDescription: Compass lets websites you allow use the microphone, for calls and recordings.
        NSFaceIDUsageDescription: Compass asks for Face ID before showing your recovery code.
        # audio: a picture-in-picture video keeps playing outside the app.
        # remote-notification: the sync server's silent push has the app
        # sync in the background (send-tab.md, "Background sync").
        UIBackgroundModes: [fetch, audio, remote-notification]
        # Self-hosted servers on the LAN or Tailscale may be plain HTTP.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: it.cipi1965.compass.pair
            CFBundleURLSchemes: [compass-pair]
          # Widgets, the icon menu, Spotlight and the extensions (DeepLink).
          - CFBundleURLName: it.cipi1965.compass.link
            CFBundleURLSchemes: [compass]
          # Web links, for when Compass is the default browser (the
          # com.apple.developer.web-browser entitlement above).
          - CFBundleURLName: it.cipi1965.compass.web
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [http, https]
        BGTaskSchedulerPermittedIdentifiers: [it.cipi1965.compass.refresh]
        # Downloads on the Lock Screen and in the Dynamic Island.
        NSSupportsLiveActivities: true
        # Spotlight results open entries (CSSearchableItemActionType).
        # it.cipi1965.compass.little-window: a little window's scene (iPad).
        # it.cipi1965.compass.tab: an entry dragged out to a new window (iPad).
        NSUserActivityTypes: [com.apple.corespotlightitem, it.cipi1965.compass.little-window, it.cipi1965.compass.tab]
        # Downloads show in the Files app (Documents/Downloads).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Shared Boosts (docs/design/boosts.md, "Sharing"): .compassboost
        # files open in Compass from Files, Mail and AirDrop.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Compass Boost
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [org.compassbrowser.boost]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: org.compassbrowser.boost
            UTTypeDescription: Compass Boost
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [compassboost]
              public.mime-type: [application/vnd.compassbrowser.boost+json]
        CompassKeychainGroup: $(AppIdentifierPrefix)it.cipi1965.compass.shared
        # The join form's default server: COMPASS_SYNC_SERVER, set in
        # ios/Local.xcconfig (gitignored; `compass ios` passes it). Empty
        # without one.
        CompassSyncServer: $(COMPASS_SYNC_SERVER)
        # Export compliance: standard algorithms (AES, HMAC, Ed25519,
        # SPAKE2, scrypt) protecting the user's own data, which is exempt.
        # Saves answering the question for every TestFlight build.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.cipi1965.compass
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: Compass
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
  AutoFill:
    type: app-extension
    platform: iOS
    sources:
      - path: AutoFill
    entitlements:
      path: AutoFill/AutoFill.entitlements
      properties:
        # The App ID it.cipi1965.compass.autofill needs the AutoFill Credential
        # Provider capability on the developer site.
        com.apple.developer.authentication-services.autofill-credential-provider: true
        keychain-access-groups:
          - $(AppIdentifierPrefix)it.cipi1965.compass.shared
    dependencies:
      - package: CompassKit
        product: CompassSync
      - sdk: AuthenticationServices.framework
    info:
      path: AutoFill/Info.plist
      properties:
        # "Compass" is taken on the App Store (ITMS-90129).
        CFBundleName: Compass Browser
        CFBundleDisplayName: Compass Browser
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CompassKeychainGroup: $(AppIdentifierPrefix)it.cipi1965.compass.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CredentialProviderViewController
          NSExtensionAttributes:
            ASCredentialProviderExtensionCapabilities:
              ProvidesPasswords: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.cipi1965.compass.autofill
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
  # Rewrites the server's "New tab" push into the sent tab's title and host
  # (docs/design/send-tab.md).
  PushService:
    type: app-extension
    platform: iOS
    sources:
      - path: PushService
    entitlements:
      path: PushService/PushService.entitlements
      properties:
        # The seed and server, as the app keeps them (Keychain.swift).
        keychain-access-groups:
          - $(AppIdentifierPrefix)it.cipi1965.compass.shared
        # PushAccounts.json. The App ID needs the App Groups capability.
        com.apple.security.application-groups:
          - group.it.cipi1965.compass
    dependencies:
      - package: CompassKit
        product: CompassSync
      - package: CompassKit
        product: CompassShared
    info:
      path: PushService/Info.plist
      properties:
        CFBundleName: Compass Browser
        CFBundleDisplayName: Compass Browser
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CompassKeychainGroup: $(AppIdentifierPrefix)it.cipi1965.compass.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.cipi1965.compass.push
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
  # The share sheet's "Compass Browser": open a link, or pin it to a space.
  Share:
    type: app-extension
    platform: iOS
    sources:
      - path: Share
    entitlements:
      path: Share/Share.entitlements
      properties:
        com.apple.security.application-groups:
          - group.it.cipi1965.compass
    dependencies:
      - package: CompassKit
        product: CompassShared
    info:
      path: Share/Info.plist
      properties:
        CFBundleName: Compass Browser
        CFBundleDisplayName: Compass Browser
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.cipi1965.compass.share
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
  # Home and Lock Screen widgets, the Control Center control and the
  # download Live Activity.
  Widgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    entitlements:
      path: Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.it.cipi1965.compass
    dependencies:
      - package: CompassKit
        product: CompassShared
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleName: Compass Browser
        CFBundleDisplayName: Compass Browser
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.cipi1965.compass.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
  # Safari's "Open in Compass" toolbar button.
  SafariOpen:
    type: app-extension
    platform: iOS
    sources:
      - path: SafariOpen/SafariWebExtensionHandler.swift
      # Its name in Italian (Settings → Apps → Safari → Extensions).
      - path: SafariOpen/InfoPlist.xcstrings
      # At the bundle's root, as Safari wants them; images/ and _locales/
      # keep their folders.
      - path: SafariOpen/Resources
        buildPhase: resources
        excludes: ["images/**", "_locales/**"]
      - path: SafariOpen/Resources/images
        type: folder
        buildPhase: resources
      - path: SafariOpen/Resources/_locales
        type: folder
        buildPhase: resources
    entitlements:
      path: SafariOpen/SafariOpen.entitlements
      properties:
        com.apple.security.application-groups:
          - group.it.cipi1965.compass
    dependencies:
      - package: CompassKit
        product: CompassShared
    info:
      path: SafariOpen/Info.plist
      properties:
        CFBundleName: Open in Compass
        CFBundleDisplayName: Open in Compass
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.cipi1965.compass.safari
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
  # Real touches (gestures), checked from screenshots taken meanwhile.
  CompassUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Compass
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.cipi1965.compass.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
