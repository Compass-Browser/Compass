# Compass sync server behind Caddy (HTTPS with automatic certificates).
# Set your domain in Caddyfile, then: docker compose up -d
# Upgrade: docker compose pull && docker compose up -d
# See README.md.

name: compass-sync

services:
  sync:
    # The prebuilt image (linux/amd64 and linux/arm64, from main). To build
    # from source instead, in a checkout's server/ directory: uncomment
    # build, then docker compose build sync && docker compose up -d
    image: ghcr.io/compass-browser/compass-sync-server:latest
    # build: .
    restart: unless-stopped
    volumes:
      - sync-data:/data
    environment:
      # Caddy's address range: its X-Forwarded-For is trusted for the
      # client IP (pairing rate limits). Must match the network below.
      COMPASS_SYNC_TRUSTED_PROXIES: 172.30.240.0/24
      # COMPASS_SYNC_PUBLIC_HOST: sync.example.com
      # Friends only: the chains served (README, "Private server").
      # COMPASS_SYNC_ALLOWED_CHAINS: "<chain id>,<chain id>"
      # COMPASS_SYNC_MAX_ENTITIES: "100000"
      # COMPASS_SYNC_MAX_BYTES: "209715200"
      # COMPASS_SYNC_POLL_SECONDS: "900"
      # COMPASS_SYNC_MAX_HISTORY: "30000"
      # COMPASS_SYNC_HISTORY_DAYS: "14"
      # COMPASS_SYNC_TOMBSTONE_DAYS: "30"
      # COMPASS_SYNC_IDLE_CHAIN_DAYS: "180"
      # COMPASS_SYNC_BACKUP_INTERVAL: "24h"   # into /data/backups
      # COMPASS_SYNC_BACKUP_KEEP: "7"
      # Company sign-in (README, "Company sign-in (OIDC)"); needs
      # COMPASS_SYNC_PUBLIC_HOST. Redirect URI:
      # https://<public host>/v2/compass/login/callback
      # COMPASS_SYNC_OIDC_ISSUER: https://id.example.com/realms/acme
      # COMPASS_SYNC_OIDC_CLIENT_ID: compass-sync
      # COMPASS_SYNC_OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc
      # COMPASS_SYNC_OIDC_NAME: Acme SSO
      # COMPASS_SYNC_OIDC_ALLOWED_DOMAINS: acme.com
      # COMPASS_SYNC_OIDC_ALLOWED_GROUPS: staff
    networks:
      - internal
    healthcheck:
      test: ["CMD", "/compass-sync-server", "healthcheck"]
      interval: 30s
      timeout: 5s
    # No published port: only Caddy reaches it.

  caddy:
    image: docker.io/library/caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - internal
    depends_on:
      - sync

networks:
  internal:
    ipam:
      config:
        - subnet: 172.30.240.0/24

volumes:
  sync-data:
  caddy-data:
  caddy-config:
