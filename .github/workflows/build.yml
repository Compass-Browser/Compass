# Full Chromium builds. GitHub-hosted runners don't have enough disk or CPU,
# so this runs on self-hosted runners labelled per OS (see docs/building.md
# for hardware). Manual until runners exist.
name: build

on:
  workflow_dispatch:
    inputs:
      config:
        type: choice
        options: [debug, release]
        default: debug

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [mac, win, linux]
    runs-on: [self-hosted, "${{ matrix.os }}", chromium]
    timeout-minutes: 720
    env:
      # Keep the checkout on the runner between jobs: syncing from scratch takes hours.
      COMPASS_CHROMIUM_DIR: ${{ vars.COMPASS_CHROMIUM_DIR }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: compass
      - name: Checkout or sync Chromium
        working-directory: compass
        shell: bash
        run: |
          if python3 tools/compass info | grep -q 'checkout present: True'; then
            python3 tools/compass sync
          else
            python3 tools/compass init
          fi
      - name: Generate
        working-directory: compass
        run: python3 tools/compass gen ${{ inputs.config }} --force
      - name: Build
        working-directory: compass
        run: python3 tools/compass build -c ${{ inputs.config }} chrome compass_unittests
      - name: Test
        working-directory: compass
        run: python3 tools/compass test -c ${{ inputs.config }}
