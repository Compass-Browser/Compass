// Specifics of COMPASS_SPACES, the sidebar's data type
// (docs/design/sync.md, "The COMPASS_SPACES data type"). Built as part of
// //components/sync/protocol (see
// patches/components-sync-protocol-protocol_sources.gni.patch); the
// EntitySpecifics field is compass_spaces = 970000.
//
// If you change or add fields, update proto_visitors.h (see
// patches/components-sync-protocol-proto_visitors.h.patch).
//
// Enumerations are int32 fields with the values listed in comments, not
// proto enums: a proto enum would need ProtoEnumToString() overloads, one
// more upstream patch. On the wire they're the same, so they can become
// enums later. 0 always means "not set"; values a client doesn't know are
// kept and passed on, not applied.

syntax = "proto2";

option java_multiple_files = true;
option java_package = "org.chromium.components.sync.protocol";

option optimize_for = LITE_RUNTIME;

package sync_pb;

import "components/sync/protocol/unique_position.proto";

// One entity per space and per sidebar node, and in the home profile's
// account one per profile of the chain; icons, Claude's memories, link
// rules, Boosts and Easels. The client tag is `uuid` (a Boost's `id`).
message CompassSpacesSpecifics {
  oneof entity {
    CompassSpace space = 1;
    CompassNode node = 2;
    CompassProfile profile = 3;
    CompassFavicon favicon = 4;
    CompassMemory memory = 5;
    CompassLinkRule link_rule = 6;
    CompassBoost boost = 7;
    CompassEasel easel = 8;
    CompassEaselObject easel_object = 9;
    CompassEaselAsset easel_asset = 10;
  }
}

message CompassSpace {
  // The space's ID (SpaceModel::id()), lowercase.
  optional string uuid = 1;
  optional string name = 2;
  // The space's color as a palette index: 1 grey, 2 blue, 3 purple, 4 pink,
  // 5 red, 6 orange, 7 yellow, 8 green. For a color off the palette, the
  // index of the palette color closest to it (never grey), which is what
  // clients that predate `color_rgb` show.
  optional int32 color = 3;
  // The space's icon: "emoji:" followed by the emoji, or "symbol:" followed
  // by the symbol's name (SpaceIcon); empty or absent for none. A value this
  // version can't read shows no icon, and is kept until the icon is changed.
  optional string icon = 4;
  // In the browser-wide list of spaces.
  optional UniquePosition directory_position = 5;
  // The sync UUID of the profile it belongs to (slice 5), whose account it's
  // in. Informational: the account decides.
  optional string profile_uuid = 6;
  // How long a Today entry may go unseen before it's archived; 0 = never.
  optional int64 archive_after_seconds = 7;

  // The theme (docs/design/spaces.md, "Theme editor"). Absent fields are the
  // defaults, which are never written; clients that predate them keep them as
  // received.

  // A color off the palette, as 0xRRGGBB. It applies only while `color` is
  // the palette index closest to it: a client that only knows `color` and
  // picks another palette color leaves a stale value here, which this rule
  // then ignores. Absent for palette colors.
  optional uint32 color_rgb = 8;
  // The colors the gradient goes on to after `color`, in order; none for a
  // plain color.
  repeated CompassColor gradient = 9;
  // How strongly the color tints, 0 to 1; absent = 0.31 (the default).
  optional double intensity = 10;
  // How much grain the tint has, 0 to 1; absent = 0.
  optional double grain = 11;
  // 1 auto (follows the system; also absent), 2 light, 3 dark.
  optional int32 appearance = 12;
}

// A color of a space's gradient.
message CompassColor {
  // A palette color, numbered as CompassSpace.color; 1 is grey.
  optional int32 palette = 1;
  // Any other color, as 0xRRGGBB; wins over `palette`.
  optional uint32 rgb = 2;
}

message CompassNode {
  // The node's ID (SidebarNode::id()), lowercase.
  optional string uuid = 1;
  // Its space; empty in FAVORITES, which belong to the profile.
  optional string space_uuid = 2;
  // Its parent; empty for an entry at the root of its section.
  optional string parent_uuid = 3;
  // 1 PINNED, 2 TODAY, 3 FAVORITES, 4 ARCHIVE. An archived entry is at the
  // root of ARCHIVE; an archived split's panes are its children.
  optional int32 section = 4;
  // Among its siblings.
  optional UniquePosition position = 5;
  // 1 TAB, 2 FOLDER, 3 SPLIT. Never changes for a node.
  optional int32 type = 6;
  optional string url = 7;
  // A tab's page title; a folder's name.
  optional string title = 8;
  // The name the user gave a tab.
  optional string custom_title = 9;
  // Folders: whether only the folder's own row shows.
  optional bool collapsed = 10;
  // TODAY tabs: when a tab was last shown on any device, in microseconds
  // since the Windows epoch. Drives auto-archive; devices keep the latest.
  optional int64 last_active_time = 11;
  // ARCHIVE: when the entry was archived, same unit. Entries archived more
  // than 30 days ago leave the server.
  optional int64 archived_time = 12;
  // PINNED and FAVORITES tabs: the page the tab goes back to when it closes
  // (its "pinned URL"), and that page's title. `url` follows the page it
  // shows. A client without them (an older one) leaves them alone; a node
  // without them keeps its own.
  optional string saved_url = 13;
  optional string saved_title = 14;
  // PINNED folders: set for a live folder, whose entries a plugin makes on
  // each device and which never sync (docs/design/live-folders.md, "Sync").
  // The node stays a FOLDER, so a client without it shows a plain, empty
  // folder, and keeps this field when it changes the node.
  optional CompassLiveSource live_source = 15;
  // FOLDERS: where the name came from (docs/design/ai-sidebar.md, "Names for
  // link folders"): 1 OPENER (a link folder, named after its page), 2 CLAUDE.
  // Not set: the user's, which Claude never changes; so a client without
  // it (an older one) leaves every name alone.
  optional int32 name_source = 16;
}

// Where a live folder's entries come from (compass::LiveSource).
message CompassLiveSource {
  // The plugin's manifest ID, e.g. "compass.rss".
  optional string plugin_id = 1;
  // The folder's settings for it, as a JSON object.
  optional string config_json = 2;
  // An installed plugin's source and the SHA-256 (lowercase hex) of what was
  // installed, so a device without it can offer to install it. Empty for a
  // built-in.
  optional string plugin_url = 3;
  optional string plugin_sha256 = 4;
}

// A profile of the chain; only in the home profile's account. Each
// profile syncs with its own account, derived from the chain's seed and
// `uuid` (docs/design/sync.md, "Profiles"); a device that doesn't have
// one creates it.
message CompassProfile {
  // Its sync UUID (compass.sync.profile_uuid), lowercase.
  optional string uuid = 1;
  optional string name = 2;
  // Chromium's default avatar icon index + 1 (0 = not set).
  optional int32 avatar = 3;
  // The home profile: its account is the chain's own, and it carries this
  // list.
  optional bool home = 4;
}

// A site's icon, so every device shows an entry's icon before it (or
// without it) loading the page (docs/design/sync.md, "Favicons"). One per
// host that an entry of the account (any section, favorites included)
// points at. Clients that predate it ignore it (their IsEntityDataValid()
// refuses an entity with none of the fields they know).
message CompassFavicon {
  // UUID-shaped, from the host, so the entity's key is a UUID like every
  // other: the first 16 bytes of SHA-256("compass-favicon:" + host), with
  // byte 6 = (b & 0x0f) | 0x50 and byte 8 = (b & 0x3f) | 0x80, formatted
  // lowercase 8-4-4-4-12. Also the client tag.
  optional string uuid = 1;
  // The URL host, lowercase, as is ("www." kept).
  optional string host = 2;
  // A PNG, square or not, at most 64 px a side and 8 KiB.
  optional bytes png = 3;
  // The source icon's larger side in px before scaling down; a device
  // replaces an icon only with a larger one, or a different one at least
  // 7 days newer.
  optional int32 source_size = 4;
  // When it was written, in microseconds since the Windows epoch.
  optional int64 update_time = 5;
}

// A fact Claude saved about the user (docs/design/claude.md, "Memory"), in
// the account of the profile it belongs to. Clients that predate it ignore
// it (their IsEntityDataValid() refuses it). Not in proto_visitors.h: its
// text stays out of sync-internals.
message CompassMemory {
  // A random UUID, lowercase. Also the client tag.
  optional string uuid = 1;
  // At most 500 characters.
  optional string text = 2;
  // In microseconds since the Windows epoch.
  optional int64 create_time = 3;
  // The last edit; of two edits, the later wins.
  optional int64 update_time = 4;
}

// A link rule (docs/design/link-routing.md): links from other apps on
// `domain` or its subdomains open in the space `space_uuid` instead of a
// little window. One per domain, in the account of the profile it belongs
// to. Clients that predate it ignore it (their IsEntityDataValid() refuses
// it). Two devices that make a rule for the same domain make the same
// entity; the later commit wins.
message CompassLinkRule {
  // UUID-shaped, from the domain, as CompassFavicon's from its host: the
  // first 16 bytes of SHA-256("compass-link-rule:" + domain), with byte 6 =
  // (b & 0x0f) | 0x50 and byte 8 = (b & 0x3f) | 0x80, formatted lowercase
  // 8-4-4-4-12. Also the client tag.
  optional string uuid = 1;
  // Normalized: lowercase ASCII (IDN as punycode), no "www." prefix, no
  // trailing dot, port or path; a registrable domain or a name under one
  // ("github.com", "gist.github.com"). A rule for a domain covers its
  // subdomains; the most specific rule wins.
  optional string domain = 2;
  // The space's ID (CompassSpace.uuid), lowercase. A rule whose space this
  // device doesn't have (deleted, or not synced yet) is kept and routes
  // nothing. An entity without it is ignored.
  optional string space_uuid = 3;
}

// A Boost (docs/design/boosts.md): CSS and JavaScript the user or Claude
// made for a site, in the account of the profile it belongs to. Clients that
// predate it ignore it (their IsEntityDataValid() refuses it). Not in
// proto_visitors.h: its code stays out of sync-internals. A deleted Boost is
// a deleted entity, as a memory is: no tombstone field.
message CompassBoost {
  // A random UUID, lowercase. Also the client tag.
  optional string id = 1;
  // What the user calls it ("Quieter GitHub").
  optional string name = 2;
  // Where it applies: a host ("example.com", which also covers
  // "www.example.com") or a domain and its subdomains ("*.example.com"),
  // optionally followed by a path prefix ("github.com/settings"). Lowercase,
  // IDN as punycode; http and https pages only.
  optional string match = 3;
  // Inserted at document start. At most 256 KB together with `js`.
  optional string css = 4;
  // Run at document idle.
  optional string js = 5;
  // Where `js` runs: "isolated" (also absent or unknown) or "main".
  optional string js_world = 6;
  optional bool enabled = 7;
  // Who made it: "user", "claude" or "shared" (added from a link or a file
  // someone shared; docs/design/boosts.md, "Sharing"). Clients keep a value
  // they don't know as it is.
  optional string author = 8;
  // In microseconds since the Windows epoch, as CompassMemory's.
  optional int64 create_time = 9;
  // The last edit; of two edits, the later wins.
  optional int64 update_time = 10;
}

// Easels (docs/design/easels.md): canvas boards of text, shapes, images,
// links and captures of page regions, in the account of the profile they
// belong to. Three kinds of entity, so two devices editing different objects
// of one board don't overwrite each other: the board, one per object, and
// one per image. Clients that predate them ignore them (their
// IsEntityDataValid() refuses them). Not in proto_visitors.h: their content
// stays out of sync-internals. A deleted board, object or image is a deleted
// entity; of two edits of the same entity, the later `update_time` wins.
//
// The board shows in the sidebar as a tab (CompassNode TAB) whose URL is
// "compass://easel/" followed by `uuid`; deleting that tab doesn't delete the
// board.
message CompassEasel {
  // A random UUID, lowercase. Also the client tag.
  optional string uuid = 1;
  optional string title = 2;
  // Its background, as the editor names it ("paper", "grid", "dark", ...);
  // absent or unknown: "paper".
  optional string palette = 3;
  // In microseconds since the Windows epoch.
  optional int64 create_time = 4;
  optional int64 update_time = 5;
}

// Something on a board. Exactly one of the content fields is set; an object
// whose content this version doesn't know is kept and shown as a grey box.
message CompassEaselObject {
  // A random UUID, lowercase. Also the client tag.
  optional string uuid = 1;
  // Its board (CompassEasel.uuid). An object whose board isn't here (not
  // synced yet, or deleted) is kept and not shown.
  optional string easel_uuid = 2;
  // Where it is, in board points from the board's top left; z orders
  // overlapping objects, higher on top.
  optional double x = 3;
  optional double y = 4;
  optional double width = 5;
  optional double height = 6;
  optional double z = 7;
  optional int64 create_time = 8;
  optional int64 update_time = 9;

  optional CompassEaselText text = 10;
  optional CompassEaselShape shape = 11;
  optional CompassEaselImage image = 12;
  optional CompassEaselLink link = 13;
  optional CompassEaselCapture capture = 14;
}

message CompassEaselText {
  // At most 20,000 characters.
  optional string text = 1;
  // A CSS color ("#1f2328"); absent: the board's text color.
  optional string color = 2;
  // "sans", "serif", "mono" or "hand"; absent or unknown: "sans".
  optional string font = 3;
  // "title", "heading", "body" or "caption"; absent or unknown: "body".
  optional string style = 4;
}

message CompassEaselShape {
  // 1 RECTANGLE, 2 CIRCLE (an ellipse in the object's box), 3 ARROW,
  // 4 FREEHAND.
  optional int32 kind = 1;
  // A CSS color; absent: the board's ink color.
  optional string color = 2;
  // ARROW: start x, y, end x, y. FREEHAND: x, y pairs, at most 4,000 points.
  // Relative to the object's top left, in board points.
  repeated double points = 3 [packed = true];
  // Line width in board points; absent: 3.
  optional double stroke_width = 4;
  // RECTANGLE and CIRCLE: filled with `color` rather than outlined.
  optional bool filled = 5;
}

message CompassEaselImage {
  // The CompassEaselAsset's `sha256`.
  optional string asset = 1;
  // Its size in pixels.
  optional int32 pixel_width = 2;
  optional int32 pixel_height = 3;
}

message CompassEaselLink {
  optional string url = 1;
  optional string title = 2;
  optional string description = 3;
  // The page's preview image, a CompassEaselAsset's `sha256`; may be absent.
  optional string image_asset = 4;
}

// A capture of a region of a page: an image, and where it came from so it
// can be taken again (Refresh).
message CompassEaselCapture {
  optional string url = 1;
  // The page's title when captured.
  optional string title = 2;
  // The CompassEaselAsset's `sha256`.
  optional string image_asset = 3;
  // The page's icon, a CompassEaselAsset's `sha256`; may be absent.
  optional string favicon_asset = 4;
  // The region, in CSS pixels of the page's viewport when it was captured...
  optional double region_x = 5;
  optional double region_y = 6;
  optional double region_width = 7;
  optional double region_height = 8;
  // ...which was scrolled this far, in a viewport of this size.
  optional double scroll_x = 9;
  optional double scroll_y = 10;
  optional double viewport_width = 11;
  optional double viewport_height = 12;
  // When the image was taken, in microseconds since the Windows epoch.
  optional int64 capture_time = 13;
}

// An image of a board: a PNG, JPEG or WebP of at most 2048 px a side and
// 512 KiB. Images are shared by content: two objects showing the same image
// point at the same asset.
message CompassEaselAsset {
  // UUID-shaped, from `sha256`, as CompassFavicon's from its host: the first
  // 16 bytes of SHA-256("compass-easel-asset:" + sha256), with byte 6 =
  // (b & 0x0f) | 0x50 and byte 8 = (b & 0x3f) | 0x80, formatted lowercase
  // 8-4-4-4-12. Also the client tag.
  optional string uuid = 1;
  // SHA-256 of `data`, lowercase hex.
  optional string sha256 = 2;
  // "image/png", "image/jpeg" or "image/webp".
  optional string mime_type = 3;
  optional bytes data = 4;
  // When it was first added; an asset no object points at for 30 days is
  // deleted by the device that notices.
  optional int64 create_time = 5;
}
